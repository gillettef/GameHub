<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>유세 대작전 - 대통령 선거 만칼라</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🗳️%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d1d1f;--mu:#6b6b70;--bd:#d9d5cb;--b:#2f6fe4;--r:#e04646;--hl:#f2b01e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16171a;--card:#212328;--tx:#eee;--mu:#9a9aa3;--bd:#3a3d44;--b:#5b93f5;--r:#f06b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16171a;--card:#212328;--tx:#eee;--mu:#9a9aa3;--bd:#3a3d44;--b:#5b93f5;--r:#f06b6b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.45}
main{max-width:860px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0 10px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:10px 14px}
button.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}
button:disabled{opacity:.4;cursor:default}
input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:120px;text-transform:lowercase}
.menu{display:grid;gap:10px;max-width:420px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch;margin-bottom:10px}
.pl{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px 12px}
.pl.on{border-color:var(--hl)}
.pl b{font-size:22px}
.mid{display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:13px;color:var(--mu)}
.status{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:10px;min-height:44px}
.ring{position:relative;aspect-ratio:1;max-width:560px;margin:0 auto}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring .hole{position:absolute;width:28%;transform:translate(-50%,-50%);min-height:0;padding:5px 3px;font-size:13px}
.ctr{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--mu);font-size:13px}
.hole{background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:8px;text-align:center;min-height:118px}
.hole.can{cursor:pointer;border-color:var(--hl)}
.hole.nx{outline:3px solid var(--hl)}
.hole.drp{animation:pop .7s}@keyframes pop{0%{scale:1.1;box-shadow:0 0 0 5px var(--hl)}100%{scale:1;box-shadow:0 0 0 0 transparent}}
.hole.lb{border-top:6px solid var(--b)}.hole.lr{border-top:6px solid var(--r)}
.hole small{color:var(--mu);display:block}
.slots{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:6px}
.sl{width:15px;height:15px;border-radius:50%;border:2px dashed var(--bd)}
.sl.t0{background:var(--b);border:2px solid var(--b)}.sl.t1{background:var(--r);border:2px solid var(--r)}
.sl.fl{color:#fff;font-size:9px;line-height:11px;text-align:center}
.full-tag{font-size:11px;color:var(--mu)}
.bus{display:flex;gap:8px;margin:10px 0;align-items:center}
.log{margin-top:10px;font-size:13px;color:var(--mu)}
details{margin-top:12px;font-size:14px}
</style></head><body><main>
<h1>🗳️ 유세 대작전 <small style="font-weight:400;color:var(--mu)">대통령 선거 만칼라</small></h1>
<div id="app"></div>
</main>
<script>
const CAP=[8,7,6,6,4,4],NM=['수도권','동해안권','서해안권','중원권','산악권','도서권'],L='ABCDEF',COL=['🔵','🔴'],CN=['파랑','빨강'];
let S=null,mode=null,me=0,room=null,busy=false,LOG=[],code='',toast='';
const $=id=>document.getElementById(id);
const pos=i=>{const a=(-90+60*i)*Math.PI/180;return [50+35*Math.cos(a),50+35*Math.sin(a)]};
function ringSvg(){let g='<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="35" fill="none" stroke="var(--bd)" stroke-width="1.2" stroke-dasharray="2 2"/>';
 for(let k=0;k<6;k++){const t=-60+60*k,a=t*Math.PI/180;g+='<g transform="translate('+(50+35*Math.cos(a))+' '+(50+35*Math.sin(a))+') rotate('+(t+180)+')"><path d="M0,-2.6 L2,1.8 L-2,1.8Z" fill="var(--mu)"/></g>'}
 return g+'</svg>'}
const cl=s=>({h:s.h.map(a=>a.slice()),r:s.r.slice(),su:s.su.slice(),p:s.p,ph:s.ph,bus:s.bus.slice(),ptr:s.ptr,src:s.src,n:s.n||0,pc:s.pc||0});
const init=()=>({h:[[],[],[],[],[],[]],r:[10,11],su:[4,4],p:0,ph:'setup',bus:[],ptr:0,src:-1,n:0,pc:0});
const full=s=>s.h.filter((a,i)=>a.length>=CAP[i]).length;
const score=s=>{const t=[0,0];s.h.forEach((a,i)=>{if(!a.length)return;const b=a.filter(x=>x==0).length,r=a.length-b;t[b>r?0:r>b?1:a[0]]+=CAP[i]});return t};
const cnt=(s,k)=>s.h.flat().filter(x=>x==k).length;
const winner=s=>{const t=score(s);if(t[0]!=t[1])return t[0]>t[1]?0:1;return s.r[0]!=s.r[1]?(s.r[0]>s.r[1]?0:1):-1};
const canPlace=s=>s.r[s.p]>0&&s.h.some((a,i)=>a.length<CAP[i]);
function put(s,i){s.h[i].push(s.p);s.hl=i;if(s.ph=='setup'){s.su[s.p]--;s.p=1-s.p;if(s.su[0]+s.su[1]==0){s.p=0;s.ph=canPlace(s)?'place':'pick'}}else{s.r[s.p]--;s.pc=(s.pc||0)+1;s.ph=(s.pc<2&&canPlace(s))?'place':'pick'}}
function pick(s,i){s.bus=s.h[i].splice(0);s.ptr=i;s.src=i;s.hl=-1;s.ph='sow'}
const nxt=s=>{for(let k=1;k<=6;k++){const j=(s.ptr+k)%6;if(s.h[j].length<CAP[j])return j}return -1};
function drop(s,c){s.bus.splice(s.bus.indexOf(c),1);const t=nxt(s);if(t<0)s.bus=[];else{s.h[t].push(c);s.ptr=t;s.hl=t;if(nxt(s)<0)s.bus=[]}}
function fin(s){s.bus=[];if(full(s)>=4||s.r[0]+s.r[1]==0){s.ph='over';return}s.pc=0;s.p=1-s.p;s.ph=canPlace(s)?'place':'pick'}
function step(s){while(s.bus.length&&s.bus.every(x=>x==s.bus[0]))drop(s,s.bus[0]);if(!s.bus.length)fin(s)}
/* ---------- AI ---------- */
function ev(s,m){if(s.ph=='over'){const w=winner(s);return w==m?1e3:w<0?0:-1e3}const t=score(s);let g=0;s.h.forEach(a=>{g+=a.filter(x=>x==m).length*2-a.length});return (t[m]-t[1-m])*3+g*.3}
function moves(s,fast){const m=s.p,out=[];let pls=[];if(canPlace(s)){for(let i=0;i<6;i++){if(s.h[i].length>=CAP[i])continue;pls.push([i]);if(fast)continue;const t=cl(s);put(t,i);if(t.ph=='place')for(let j=i;j<6;j++)if(t.h[j].length<CAP[j])pls.push([i,j])}}else pls=[[]];
 for(const pl of pls){const a=cl(s);for(const x of pl)put(a,x);if(!pl.length)a.ph='pick';
  for(let i=0;i<6;i++){if(!a.h[i].length)continue;const b=cl(a);pick(b,i);step(b);const o=[];
   while(b.ph=='sow'){let c=b.bus[0];
    if(!fast&&new Set(b.bus).size>1){let bv=-1e9;for(const k of new Set(b.bus)){const t=cl(b);drop(t,k);step(t);const v=ev(t,m);if(v>bv){bv=v;c=k}}}
    else if(fast&&b.bus.includes(m))c=m;
    o.push(c);drop(b,c);step(b)}
   out.push({pl,i,o,res:b})}}
 return out}
function aiPlan(s){const m=s.p;let best=null,bv=-1e9;
 for(const mv of moves(s)){let v;if(mv.res.ph=='over')v=ev(mv.res,m);else{v=1e9;for(const r of moves(mv.res,true)){const x=ev(r.res,m);if(x<v)v=x}}
  v+=Math.random()*.3;if(v>bv){bv=v;best=mv}}return best}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function advance(){render();sync();
 while(S.bus.length&&S.bus.every(x=>x==S.bus[0])){await sleep(800);drop(S,S.bus[0]);render();sync()}
 if(!S.bus.length&&S.ph=='sow'){await sleep(800);fin(S)}}
async function runSow(fn){busy=true;fn();await advance();busy=false;commit()}
async function aiGo(){if(!S||S.p!=1||S.ph=='over')return;busy=true;render();await sleep(600);
 if(S.ph=='setup'){let bv=-1e9,bi=0;for(let i=0;i<6;i++){if(S.h[i].length>=CAP[i])continue;const t=cl(S);put(t,i);const v=ev(t,1)+Math.random();if(v>bv){bv=v;bi=i}}
  lg('🔴 '+L[bi]+' 배치');put(S,bi);busy=false;commit();return}
 const pl=aiPlan(S);
 if(S.ph=='place')for(const x of pl.pl){lg('🔴 '+L[x]+' 조직 투입');put(S,x);render();await sleep(900)}
 lg('🔴 '+L[pl.i]+'에서 버스 출발');pick(S,pl.i);await advance();
 for(const c of pl.o){await sleep(800);drop(S,c);await advance()}
 busy=false;commit()}
/* ---------- 흐름 ---------- */
const lg=t=>{LOG.unshift(t);LOG=LOG.slice(0,5)};
const who=()=>mode=='ai'?0:mode=='online'?me:S.p;
const canAct=()=>S&&!busy&&S.ph!='over'&&(mode=='ai'?S.p==0:mode=='online'?S.p==me&&room:true);
function commit(){render();sync();if(mode=='ai'&&S.p==1&&S.ph!='over')setTimeout(aiGo,400)}
function clickHole(i){if(!canAct())return;const p=S.p;
 if(S.ph=='setup'||S.ph=='place'){if(S.h[i].length>=CAP[i])return;lg(COL[p]+' '+L[i]+(S.ph=='setup'?' 배치':' 조직 투입'));put(S,i);commit()}
 else if(S.ph=='pick'){if(!S.h[i].length)return;lg(COL[p]+' '+L[i]+'에서 버스 출발');runSow(()=>pick(S,i))}}
function skipPlace(){if(!canAct()||S.ph!='place'||!(S.pc>=1))return;S.ph='pick';commit()}
function clickDrop(c){if(!canAct()||S.ph!='sow'||!S.bus.includes(c))return;runSow(()=>drop(S,c))}
function sync(){if(mode!='online'||!room)return;S.n=(S.n||0)+1;room.emit('state',{s:S,l:LOG}).catch(()=>{})}
function start(m){mode=m;S=init();LOG=[];busy=false;render()}
async function online(host){const R=(typeof claude!='undefined')?await claude.use('room'):null;
 if(!R){toast='온라인 대결은 claude.ai에 게시된 버전에서만 쓸 수 있어요. (이 파일에서는 AI 대결과 한 기기 2인 대결을 지원합니다)';render();return}
 if(!host)code=($('code').value||'').toLowerCase().replace(/[^a-z0-9]/g,'');else code=Math.random().toString(36).slice(2,6);
 if(code.length<3){toast='방 코드를 입력하세요.';render();return}
 try{room=await R.join('g'+code)}catch(e){toast='방 참가에 실패했어요.';render();return}
 mode='online';me=host?0:1;S=host?init():null;LOG=[];
 room.on('state',m=>{if(m.sameTab)return;const d=m.data;if(!d||!d.s||!Array.isArray(d.s.h))return;if(S&&(d.s.n||0)<=(S.n||0))return;S=d.s;LOG=Array.isArray(d.l)?d.l.slice(0,5).map(String):[];render()});
 room.on('hello',m=>{if(!m.sameTab&&me==0&&S)sync()});
 if(!host){const ping=()=>{if(S||!room)return;room.emit('hello',{}).catch(()=>{});setTimeout(ping,2000)};ping()}
 render()}
function menu(){if(room){room.leave().catch(()=>{});room=null}S=null;mode=null;toast='';render()}
function again(){S=init();S.n=(S.n||0)+1000;LOG=[];busy=false;commit()}
/* ---------- 화면 ---------- */
function status(){const s=S,t=score(s);
 if(!s)return '상대방이 접속하길 기다리는 중… (방 코드 '+code+')';
 if(s.ph=='over'){const w=winner(s);return '🏁 선거일! '+(w<0?'<b>무승부</b>':COL[w]+' <b>'+CN[w]+'</b> 후보 당선')+' ('+t[0]+' : '+t[1]+')'+(t[0]==t[1]?' · 동점이라 남은 예비군 비교 ('+s.r[0]+' : '+s.r[1]+')':'')}
 const mine=(mode=='local')||who()==s.p;
 const nm=mode=='ai'?(s.p==0?'내':'AI(🔴)'):COL[s.p]+' '+CN[s.p];
 if(!mine)return mode=='ai'?'🤖 AI가 생각하는 중…':'⏳ 상대('+COL[s.p]+') 차례입니다.';
 const who2=mode=='local'?COL[s.p]+' '+CN[s.p]+' 차례 · ':'';
 if(s.ph=='setup')return who2+'<b>배치</b>: 토큰을 놓을 권역을 고르세요 (남은 '+s.su[s.p]+'개)';
 if(s.ph=='place')return who2+'<b>① 조직 투입</b> ('+(s.pc+1>2?2:s.pc+1)+'/2): 예비군을 놓을 권역을 고르세요'+(s.pc>=1?' (또는 투입 완료)':'');
 if(s.ph=='pick')return who2+'<b>② 출발지 선택</b>: 버스를 출발시킬 권역을 고르세요';
 const n=nxt(s);return who2+'<b>③ 유세 순회</b>: 내려놓을 토큰을 고르세요 → 다음 정차 '+(n<0?'없음':L[n]+' '+NM[n])}
function render(){const a=$('app');
 if(!mode){a.innerHTML='<div class="menu"><div class="status">두 후보가 6개 권역을 돌며 지지자를 모읍니다. 포화 권역이 4곳이 되면 선거일!</div>'+
  '<button class="pri" onclick="start(\'ai\')">🤖 AI와 대결 (나=🔵 선공)</button>'+
  '<button onclick="start(\'local\')">👥 한 기기에서 2인 대결</button>'+
  '<div class="status"><b>🌐 온라인 대결</b><div class="row" style="margin-top:8px"><button onclick="online(true)">방 만들기</button><input id="code" placeholder="방 코드" maxlength="8"><button onclick="online(false)">참가</button></div><small style="color:var(--mu)">방장=🔵 선공, 참가자=🔴. 두 사람이 같은 링크를 열고 접속해야 해요.</small></div>'+
  (toast?'<div class="status">'+toast+'</div>':'')+rules()+'</div>';return}
 if(!S){a.innerHTML='<div class="status">'+status()+'</div><button onclick="menu()">나가기</button>';return}
 const t=score(S),f=full(S);
 const pl=k=>'<div class="pl'+(S.p==k&&S.ph!='over'?' on':'')+'">'+COL[k]+' '+CN[k]+(mode=='ai'?(k==1?' (AI)':' (나)'):mode=='online'?(k==me?' (나)':' (상대)'):'')+'<br><b>'+t[k]+'</b>표 <small style="color:var(--mu)">예비군 '+S.r[k]+(S.ph=='setup'?' · 배치 '+S.su[k]:'')+'</small></div>';
 let h='<div class="score">'+pl(0)+'<div class="mid">포화<b style="font-size:20px;color:var(--tx)">'+f+'/4</b></div>'+pl(1)+'</div><div class="status">'+status()+'</div><div class="ring">'+ringSvg()+'<div class="ctr">🗳️<br>시계 방향<br>A→B→C→D→E→F→A</div>';
 const nx=S.ph=='sow'?nxt(S):-2;
 S.h.forEach((g,i)=>{const b=g.filter(x=>x==0).length,r=g.length-b,fl=g.length>=CAP[i];
  const can=canAct()&&((S.ph=='setup'||S.ph=='place')?!fl:S.ph=='pick'?g.length>0:false);
  let sl='';for(let k=0;k<CAP[i];k++)sl+='<div class="sl'+(k<g.length?' t'+g[k]:'')+(k==0&&g.length?' fl':'')+'">'+(k==0&&g.length?'⚑':'')+'</div>';
  h+='<div class="hole'+(can?' can':'')+(i==nx?' nx':'')+(i==S.hl&&S.ph!='over'?' drp':'')+(g.length?(b>r||(b==r&&g[0]==0)?' lb':' lr'):'')+'" style="left:'+pos(i)[0]+'%;top:'+pos(i)[1]+'%" '+(can?'onclick="clickHole('+i+')"':'')+'><b>'+L[i]+'</b> '+NM[i]+'<small>선거인단 '+CAP[i]+'</small><div class="slots">'+sl+'</div>'+(fl?'<div class="full-tag">포화</div>':'')+'</div>'});
 h+='</div>';
 if(S.ph=='sow'){const c0=S.bus.filter(x=>x==0).length,c1=S.bus.length-c0;
  h+='<div class="bus">🚌 버스:'+[[0,c0],[1,c1]].filter(x=>x[1]).map(x=>'<button class="pri" '+(canAct()?'':'disabled')+' onclick="clickDrop('+x[0]+')">'+COL[x[0]]+' ×'+x[1]+'</button>').join('')+'</div>'}
 h+='<div class="row" style="margin-top:12px">'+(canAct()&&S.ph=='place'&&S.pc>=1?'<button class="pri" onclick="skipPlace()">투입 완료</button>':'')+(S.ph=='over'&&(mode!='online'||me==0)?'<button class="pri" onclick="again()">다시 하기</button>':'')+'<button onclick="menu()">메뉴</button></div>';
 h+='<div class="log">'+LOG.map(x=>'<div>'+x.replace(/[<>&]/g,'')+'</div>').join('')+'</div>'+rules();
 a.innerHTML=h}
function rules(){return '<details><summary>규칙 보기</summary><ol><li>시작: 각자 토큰 4개를 번갈아 배치 (예비군은 선공 10개, 후공 11개)</li><li>① 예비군을 1~2개 포화되지 않은 권역에 투입 (최소 1개)</li><li>② 토큰이 있는 권역을 골라 모두 버스에 태움</li><li>③ 다음 권역부터 1개씩 내려놓기. 포화 권역은 건너뛰고, 놓을 곳이 없으면 남은 토큰은 낙선. 내려놓는 순서는 자유</li><li>포화 권역이 4곳 이상(또는 예비군 모두 소진)이면 선거일</li><li>권역별 다수 후보가 선거인단 획득(A 8, B 7, C·D 6, E·F 4). 권역 동점이면 맨 앞 토큰(⚑ 깃발)의 색이 승리. 최종 동점이면 남은 예비군이 많은 쪽 승, 같으면 무승부</li></ol></details>'}
render();
</script></body></html>
