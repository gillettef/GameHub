<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" aria-hidden="true">
  <!-- 랜딩 히어로: 하늘에 뜬 고리 행성(본체 + 띠 + 고리). 중심 (262,118) r64. 히어로의 다른 층과 같은 400×360 틀 -->
  <defs>
    <radialGradient id="ntLpBody" cx="0.34" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#8296d6"/>
      <stop offset="0.42" stop-color="#3b4a88"/>
      <stop offset="0.78" stop-color="#1c2552"/>
      <stop offset="1" stop-color="#0f1430"/>
    </radialGradient>
    <radialGradient id="ntLpShade" cx="0.82" cy="0.86" r="0.9">
      <stop offset="0" stop-color="#04060d" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#04060d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#04060d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ntLpRing" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9cc2ff" stop-opacity="0.15"/>
      <stop offset="0.3" stop-color="#dfe9ff" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#f4c56a" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#f4c56a" stop-opacity="0.12"/>
    </linearGradient>
    <clipPath id="ntLpClip"><circle cx="262" cy="118" r="64"/></clipPath>
  </defs>

  <!-- 고리 뒤쪽 -->
  <g transform="translate(262 118) rotate(-18)" fill="none" stroke-linecap="round">
    <path d="M-130 0A130 25 0 0 1 130 0" stroke="#9cc2ff" stroke-width="1" opacity=".3"/>
    <path d="M-114 0A114 21.5 0 0 1 114 0" stroke="url(#ntLpRing)" stroke-width="6" opacity=".45"/>
    <path d="M-97 0A97 18 0 0 1 97 0" stroke="#dfe9ff" stroke-width="1.4" opacity=".3"/>
  </g>

  <!-- 본체 -->
  <circle cx="262" cy="118" r="64" fill="url(#ntLpBody)"/>
  <g clip-path="url(#ntLpClip)" fill="none" stroke-linecap="round">
    <g transform="rotate(-18 262 118)">
      <path d="M190 92H334" stroke="#b996ff" stroke-width="7" opacity=".16"/>
      <path d="M190 108H334" stroke="#3fe3b8" stroke-width="3" opacity=".12"/>
      <path d="M190 126H334" stroke="#dfe9ff" stroke-width="10" opacity=".07"/>
      <path d="M190 146H334" stroke="#b996ff" stroke-width="4" opacity=".14"/>
    </g>
    <circle cx="262" cy="118" r="64" fill="url(#ntLpShade)"/>
  </g>
  <circle cx="262" cy="118" r="64" fill="none" stroke="#9cc2ff" stroke-width="1" opacity=".5"/>

  <!-- 고리 앞쪽 -->
  <g transform="translate(262 118) rotate(-18)" fill="none" stroke-linecap="round">
    <path d="M-130 0A130 25 0 0 0 130 0" stroke="#9cc2ff" stroke-width="1" opacity=".45"/>
    <path d="M-114 0A114 21.5 0 0 0 114 0" stroke="url(#ntLpRing)" stroke-width="6"/>
    <path d="M-97 0A97 18 0 0 0 97 0" stroke="#dfe9ff" stroke-width="1.4" opacity=".5"/>
  </g>

  <!-- 작은 달 -->
  <circle cx="64" cy="74" r="8" fill="#6d7898"/>
  <circle cx="61.5" cy="71.5" r="6" fill="#cfd8ee" opacity=".55"/>
</svg>
