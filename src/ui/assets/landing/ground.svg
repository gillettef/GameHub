<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" aria-hidden="true">
  <!-- 랜딩 히어로: 착륙지 지평선(먼 능선 + 땅 + 생물발광 식생). 지평선 꼭대기 (200,244). 400×360 틀 -->
  <defs>
    <linearGradient id="ntLgHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fe3b8" stop-opacity="0"/>
      <stop offset="1" stop-color="#3fe3b8" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="ntLgGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13203a"/>
      <stop offset="0.4" stop-color="#0a1222"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
  </defs>

  <!-- 지평선 위 대기 광채 -->
  <rect x="0" y="176" width="400" height="86" fill="url(#ntLgHaze)"/>

  <!-- 먼 능선(가운데 착륙지는 비워 둠) -->
  <path d="M0 256L18 238L34 246L58 224L80 240L100 233L124 246L142 252L142 262H0Z" fill="#17223f"/>
  <path d="M400 256L384 240L366 247L344 220L322 238L300 231L278 246L260 252L260 262H400Z" fill="#17223f"/>

  <!-- 땅 -->
  <path d="M0 262Q200 226 400 262V360H0Z" fill="url(#ntLgGround)"/>
  <path d="M0 262Q200 226 400 262" fill="none" stroke="#3fe3b8" stroke-width="6" opacity=".1"/>
  <path d="M0 262Q200 226 400 262" fill="none" stroke="#3fe3b8" stroke-width="1.2" opacity=".55"/>

  <!-- 생물발광 식생: 왼쪽 -->
  <g fill="none" stroke="#22345a" stroke-width="2.6" stroke-linecap="round">
    <path d="M44 262Q40 236 50 214"/>
    <path d="M62 260Q66 246 60 232"/>
    <path d="M28 266Q27 254 22 246"/>
    <path d="M352 262Q358 232 348 208"/>
    <path d="M336 260Q332 248 338 236"/>
    <path d="M372 266Q374 256 380 248"/>
  </g>
  <g fill="#3fe3b8">
    <circle cx="50" cy="212" r="11" opacity=".14"/>
    <circle cx="348" cy="206" r="12" opacity=".14"/>
    <circle cx="50" cy="212" r="4"/>
    <circle cx="348" cy="206" r="4.5"/>
    <circle cx="22" cy="245" r="2.5" opacity=".8"/>
    <circle cx="380" cy="247" r="2.5" opacity=".8"/>
  </g>
  <g fill="#b6ff7a">
    <circle cx="60" cy="230" r="3"/>
    <circle cx="338" cy="234" r="3"/>
  </g>

  <!-- 땅 위 발광 점 -->
  <g fill="#3fe3b8" opacity=".5">
    <circle cx="92" cy="300" r="1"/><circle cx="148" cy="322" r=".8"/>
    <circle cx="302" cy="296" r="1"/><circle cx="242" cy="332" r=".8"/>
    <circle cx="70" cy="282" r=".8"/><circle cx="330" cy="314" r="1.1"/>
    <circle cx="180" cy="344" r=".9"/>
  </g>

  <!-- 앞쪽 바위 그림자 -->
  <path d="M0 326Q58 308 112 330V360H0Z" fill="#04060c" opacity=".85"/>
  <path d="M290 338Q350 314 400 324V360H290Z" fill="#04060c" opacity=".85"/>
</svg>
