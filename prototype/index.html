<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LASTGRAIN</title>
  <meta name="description" content="LASTGRAIN — 실물 모래시계 전술 보드게임의 웹 시뮬레이터. 봇이나 다른 네트워크의 친구와 대전한다.">
  <meta name="theme-color" content="#2a1d13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LASTGRAIN">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 홈 -->
  <section id="home" class="screen home">
    <div class="hero">
      <div class="logo">LASTGRAIN</div>
      <p class="tag">모래가 다하기 전에</p>
      <p class="lead">당신의 모래시계는 <b>당신의 차례에만</b> 흐른다.<br>오래 고민할수록 군대가 줄어든다.</p>
    </div>

    <div class="stack">
      <button class="btn big primary" id="btn-bot" type="button">봇과 대전</button>
      <button class="btn big blue" id="btn-host" type="button">친구와 온라인 대전 · 방 만들기</button>
      <form class="join" id="join-form" autocomplete="off">
        <input id="join-code" name="code" inputmode="text" autocapitalize="characters" maxlength="5" placeholder="방 코드 5자리" aria-label="방 코드" spellcheck="false">
        <button class="btn" type="submit">참가</button>
      </form>
      <p class="err" id="home-err" role="alert"></p>
    </div>

    <details class="settings">
      <summary>게임 설정</summary>
      <form id="settings" class="grid">
        <label>내 순서
          <select name="side"><option value="random">무작위</option><option value="0">선 플레이어</option><option value="1">후 플레이어 (+2점)</option></select></label>
        <label>대모래시계
          <select name="greatMin"><option value="20">20분 (정식)</option><option value="10">10분</option><option value="5">5분</option></select></label>
        <label>목표 점수
          <select name="target"><option value="25">25점 (정식)</option><option value="15">15점</option><option value="10">10점</option></select></label>
        <label>조작 시간
          <select name="handleMs"><option value="1000">모래시계당 1초 (정식)</option><option value="0">끔</option></select></label>
        <label>봇 난이도
          <select name="level"><option value="easy">쉬움</option><option value="normal" selected>보통</option><option value="hard">어려움</option></select></label>
        <label>봇 생각 속도
          <select name="botDelay"><option value="2500">느림 · 행동당 2.5초</option><option value="1500" selected>보통 · 1.5초</option><option value="800">빠름 · 0.8초</option></select></label>
        <label class="check"><input type="checkbox" name="showSec" checked> 잔량을 초로 표시</label>
      </form>
      <p class="hint">온라인 대전은 방을 만든 사람의 설정을 따른다.</p>
    </details>
    <a class="rules-link" href="rules.html" target="_blank" rel="noopener">규칙서 읽기 →</a>
  </section>

  <!-- 대기실 -->
  <section id="wait" class="screen wait" hidden>
    <p class="wait-label">방 코드</p>
    <div class="code" id="wait-code">-----</div>
    <p class="wait-sub">친구에게 코드나 링크를 보내라.</p>
    <div class="stack">
      <button class="btn big primary" id="btn-share" type="button">링크 공유</button>
      <button class="btn big" id="btn-copy" type="button">링크 복사</button>
    </div>
    <p class="wait-status"><span class="spinner" aria-hidden="true"></span> 상대를 기다리는 중…</p>
    <p class="hint" id="wait-cfg"></p>
    <button class="btn ghost" id="btn-wait-cancel" type="button">홈으로</button>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen game" hidden>
    <header class="hud">
      <div class="chip opp" id="chip-opp"></div>
      <div class="glass" id="glass" aria-label="대모래시계"></div>
      <div class="chip me" id="chip-me"></div>
    </header>
    <div class="tray opp-tray" id="opp-reserve" aria-label="상대 비축"></div>
    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <div class="board-wrap"><div class="board" id="board" aria-label="사구 보드"></div></div>
    <div class="tray my-tray" id="my-reserve" aria-label="내 비축 (눌러서 소환)"></div>
    <nav class="bar">
      <button class="icon-btn" id="btn-menu" type="button" aria-label="메뉴">☰</button>
      <button class="btn end" id="btn-end" type="button">차례 마치기</button>
      <button class="icon-btn" id="btn-log" type="button" aria-label="기록">≡<span class="badge" id="log-badge" hidden></span></button>
    </nav>
  </section>

  <!-- 하단 시트 -->
  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
  <div class="sheet tall" id="log-sheet" hidden role="dialog" aria-modal="true" aria-label="기록">
    <div class="sheet-head"><b>기록</b><button class="btn ghost small" type="button" data-close>닫기</button></div>
    <ol class="log" id="log"></ol>
  </div>

  <div class="count" id="count" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <dialog id="over" class="dialog">
    <div id="over-body"></div>
    <div class="dialog-actions">
      <button class="btn" id="btn-over-home" type="button">홈으로</button>
      <button class="btn primary" id="btn-again" type="button">다시 하기</button>
    </div>
  </dialog>

  <script type="module" src="src/ui.js"></script>
</body>
</html>
