<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CREASE">
<title>CREASE 시뮬레이터</title>
<style>
  :root {
    --bg: #17212b; --bg2: #1f2c38; --bg3: #2a3a48; --line: #3a4d5e;
    --ink: #f3ead6; --ink2: #b9c3cc; --muted: #7f8f9c;
    --paper: #f4ecd8; --paper-back: #d5e2ea; --paper-line: #b6a888;
    --gold: #e6b43c; --gold-ink: #3a2a00; --danger: #e2525f;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    font-size: 16px; line-height: 1.45; -webkit-font-smoothing: antialiased;
    overscroll-behavior: none; touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  #app { min-height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
    padding: calc(var(--safe-t) + 8px) 14px calc(var(--safe-b) + 10px); }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
  input, select { font: inherit; }

  .topbar { display: flex; align-items: center; gap: 8px; min-height: 44px; }
  .topbar h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 700; text-align: center; }
  .icon-btn { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; color: var(--ink2); }
  .icon-btn:active { background: var(--bg3); }
  .btn { min-height: 50px; border-radius: var(--r); padding: 0 18px; font-weight: 700; font-size: 17px;
    background: var(--bg3); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .btn.primary { background: var(--gold); color: var(--gold-ink); }
  .btn.block { width: 100%; }
  .btn:disabled { opacity: .35; }
  .btn:active:not(:disabled) { transform: scale(.98); }
  .card { background: var(--bg2); border-radius: 18px; padding: 16px; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .label { font-size: 13px; color: var(--muted); font-weight: 600; margin: 2px 2px 6px; }
  .seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; min-height: 40px; border-radius: 9px; font-weight: 600; color: var(--ink2); }
  .seg button[aria-pressed="true"] { background: var(--bg3); color: var(--ink); box-shadow: 0 1px 2px #0006; }
  .field { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    padding: 0 14px; font-size: 17px; -webkit-user-select: text; user-select: text; }
  .muted { color: var(--muted); font-size: 14px; }

  .hero { text-align: center; padding: 26px 0 18px; }
  .logo { font-size: 40px; font-weight: 800; letter-spacing: 10px; margin: 0; padding-left: 10px;
    background: linear-gradient(180deg, #fff6df, #e6b43c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 6px 0 0; color: var(--ink2); font-size: 15px; }
  .menu { display: grid; gap: 10px; }
  .menu button { text-align: left; background: var(--bg2); border-radius: 18px; padding: 14px 16px; min-height: 72px;
    display: grid; grid-template-columns: 44px 1fr 16px; align-items: center; gap: 14px; }
  .menu button:active { background: var(--bg3); }
  .menu .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 22px; background: var(--bg3); }
  .menu b { display: block; font-size: 17px; }
  .menu span { color: var(--muted); font-size: 14px; }
  .menu i { color: var(--muted); font-style: normal; }

  .game { display: flex; flex-direction: column; flex: 1; gap: 10px; }
  .turn { display: flex; align-items: center; gap: 10px; background: var(--bg2); border-radius: 16px; padding: 10px 12px; min-height: 56px;
    border-left: 6px solid var(--turn, var(--gold)); }
  .turn .who { flex: 1; min-width: 0; }
  .turn .who b { display: block; font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .turn .who span { font-size: 13px; color: var(--muted); }
  .pips { display: flex; gap: 5px; align-items: center; }
  .pip { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); }
  .pip.used { background: var(--bg3); }
  .fold-chip { font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 8px; background: var(--gold); color: var(--gold-ink); }
  .fold-chip.used { background: var(--bg3); color: var(--muted); }
  .players { display: grid; grid-template-columns: repeat(var(--n, 2), 1fr); gap: 6px; }
  .pl { background: var(--bg2); border-radius: 12px; padding: 7px 8px; min-width: 0; border-top: 3px solid var(--c); opacity: .78; }
  .pl.active { opacity: 1; background: var(--bg3); }
  .pl .nm { font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pl .sc { font-size: 19px; font-weight: 800; }
  .pl .sc small { font-size: 12px; color: var(--muted); font-weight: 600; }
  .pl .cr { font-size: 12px; color: var(--gold); letter-spacing: 1px; min-height: 16px; }
  .pl.off .nm::after { content: " · 끊김"; color: var(--danger); }
  .board-wrap { position: relative; }
  #board { width: 100%; height: auto; display: block; touch-action: manipulation; }
  #board .table { fill: #10181f; }
  #board .col { transition: transform .5s cubic-bezier(.4,.1,.2,1), opacity .35s; }
  #board .cell { stroke: var(--paper-line); stroke-width: .8; }
  #board .cell.front { fill: var(--paper); }
  #board .cell.back { fill: var(--paper-back); }
  #board .cell.legal { fill: #bfe6c9; cursor: pointer; }
  #board .coord { font-size: 8.5px; fill: #8d8370; pointer-events: none; font-weight: 600; }
  #board .empty-slot { fill: none; stroke: #4b5d6b; stroke-dasharray: 3 4; }
  #board .seam { stroke: var(--gold); stroke-width: 3.5; stroke-linecap: round; }
  #board .anchor { fill: none; stroke-width: 2.6; pointer-events: none; }
  #board .shard { fill: var(--gold); stroke: #7a5600; stroke-width: .8; pointer-events: none; }
  #board .shard-absent { fill: #8d939a; stroke: #5d646b; pointer-events: none; }
  #board .spawn-ping { fill: none; stroke: var(--gold); stroke-width: 2.5; opacity: 0; transform-box: fill-box; transform-origin: center; animation: ping 1.2s ease-out 1; pointer-events: none; }
  @keyframes ping { 0% { opacity: .95; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.3); } }
  #board .piece { transition: transform .4s ease; pointer-events: none; }
  #board .pawn { stroke: #1b232b; stroke-width: 2; }
  #board .pawn-num { font-size: 11px; font-weight: 800; fill: #fff; text-anchor: middle; }
  #board .piece.absent { opacity: .7; }
  #board .piece.focus .pawn { stroke: #fff; stroke-width: 3; }
  .preview-tag { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--gold-ink);
    font-size: 13px; font-weight: 700; border-radius: 99px; padding: 4px 12px; white-space: nowrap; box-shadow: 0 2px 8px #0008; pointer-events: none; }
  .feed { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 60px; overflow: hidden; display: flex; flex-direction: column; gap: 4px;
    -webkit-mask-image: linear-gradient(#000 55%, transparent); mask-image: linear-gradient(#000 55%, transparent); }
  .feed li { font-size: 14px; color: var(--muted); padding: 2px 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .feed li:first-child { color: var(--ink); font-weight: 600; }
  .feed li.spawn { color: #d9c48a; }
  .feed li b { color: var(--gold); }
  .toast:empty { display: none; }
  .toast { min-height: 22px; font-size: 14px; color: var(--ink2); text-align: center; padding: 0 6px; }
  .toast b { color: var(--gold); }
  .controls { display: grid; gap: 8px; }
  .fold-row { display: grid; grid-template-columns: 52px repeat(3, 1fr) 1.3fr; gap: 6px; align-items: center; }
  .fold-row .side { font-size: 13px; color: var(--muted); font-weight: 700; text-align: center; }
  .fold-row button { min-height: 46px; border-radius: 12px; background: var(--bg3); font-weight: 700; font-size: 15px; }
  .fold-row button:disabled { opacity: .28; }
  .fold-row button.pending { background: var(--gold); color: var(--gold-ink); }
  .end-btn { min-height: 56px; font-size: 18px; }
  .waiting { text-align: center; padding: 14px; border-radius: 16px; background: var(--bg2); color: var(--ink2); }
  .playback { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 8px; }

  .sheet-bg { position: fixed; inset: 0; background: #000a; display: flex; align-items: flex-end; justify-content: center; z-index: 10; animation: fade .2s; }
  .sheet { width: 100%; max-width: 560px; max-height: 82vh; overflow: auto; background: var(--bg2); border-radius: 22px 22px 0 0;
    padding: 10px 16px calc(var(--safe-b) + 16px); animation: up .25s cubic-bezier(.2,.8,.2,1); }
  .sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
  .sheet h3 { margin: 4px 0 12px; font-size: 19px; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  .log { padding: 0; margin: 0; }
  .log li { padding: 7px 0; border-bottom: 1px solid var(--bg3); font-size: 14px; color: var(--ink2); list-style: none; }
  .result { text-align: center; }
  .result .trophy { font-size: 46px; }
  .rank { display: grid; gap: 6px; margin: 14px 0; text-align: left; }
  .rank div { display: flex; justify-content: space-between; padding: 10px 12px; border-radius: 12px; background: var(--bg3); border-left: 5px solid var(--c); }

  .code { font-size: 44px; font-weight: 800; letter-spacing: 12px; text-align: center; padding-left: 12px; color: var(--gold); margin: 4px 0; }
  .seat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 12px; min-height: 54px; }
  .seat .dot { width: 14px; height: 14px; border-radius: 50%; flex: none; }
  .seat .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seat button { min-height: 36px; padding: 0 12px; border-radius: 10px; background: var(--bg3); font-size: 14px; font-weight: 600; }

  .bar { height: 30px; border-radius: 8px; background: var(--bg); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: var(--c); border-radius: 8px; transition: width .3s; }
  .bar span { position: absolute; left: 10px; top: 4px; font-size: 14px; font-weight: 700; color: #fff; text-shadow: 0 1px 2px #000a; }
  .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .progress { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .progress i { display: block; height: 100%; background: var(--gold); width: 0; transition: width .15s; }
  .rules { padding-left: 18px; margin: 0; }
  .rules li { margin: 0 0 10px; color: var(--ink2); }
  .rules b { color: var(--ink); }

  @media (orientation: landscape) and (max-height: 500px) {
    #app { max-width: none; padding-left: calc(env(safe-area-inset-left) + 12px); padding-right: calc(env(safe-area-inset-right) + 12px); padding-top: 8px; }
    .game { display: grid; grid-template-columns: 1.6fr 1fr; grid-auto-rows: min-content; column-gap: 14px; row-gap: 8px; }
    .game > .board-wrap { grid-column: 1; grid-row: 1 / span 6; align-self: center; }
    .game > :not(.board-wrap) { grid-column: 2; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
