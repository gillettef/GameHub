  section { max-width: 900px; margin: 0 auto 28px; }

  .set { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }

  .glyph--vellum code { color: var(--bc-ink-soft); }
  .glyph--crown .bc-ico { font-size: 56px; }
</style>
</head>

<header class="sheet-title">
  <h1>엠블럼</h1>
  <p>emblems.svg 의 모든 기호. 모두 currentColor 한 색이라 어느 바탕에서나 color 만 바꿔 쓴다. 문양·그림자·왕관은 32 격자, 나머지는 24 격자.</p>

<section><h2>문양 · 그림자 · 검은 왕관</h2><div class="set" id="core"></div></section>
<section><h2>직업</h2><div class="set" id="classes"></div></section>
<section><h2>타일</h2><div class="set" id="tiles"></div></section>
<section><h2>화면 기호 · 아이템</h2><div class="set" id="ui"></div></section>
<script src="markup.js"></script>
<script>
  const g = (id, name, cls = '', style = '') =>
    `<div class="glyph ${cls}" style="${style}"><svg class="bc-ico"><use href="#${id}"/></svg><span>${name}</span><code>${id}</code></div>`
  document.getElementById('core').innerHTML =
    g('bc-suit-blade', '칼날', 'glyph--vellum bc-suit--blade', 'color:var(--suit)') +
    g('bc-suit-ward', '방패', 'glyph--vellum bc-suit--ward', 'color:var(--suit)') +
    g('bc-suit-lantern', '등불', 'glyph--vellum bc-suit--lantern', 'color:var(--suit)') +
    g('bc-suit-coin', '금화', 'glyph--vellum bc-suit--coin', 'color:var(--suit)') +
    g('bc-shadow', '그림자', '', 'color:var(--bc-umbra-hi)') +
    g('bc-crown', '검은 왕관', 'glyph--crown', 'color:#0b080d;background:var(--bc-gilt-leaf)')
  document.getElementById('classes').innerHTML =
    [['knight', '기사'], ['mage', '마법사'], ['cleric', '성직자'], ['rogue', '도적'], ['hunter', '사냥꾼']]
      .map(([k, n], i) => g('bc-class-' + k, n, '', `color:var(--bc-seat-${i + 1})`)).join('')
  document.getElementById('tiles').innerHTML =
    [['monster', '몬스터'], ['boss', '장 보스'], ['wander', '방랑 몬스터'], ['treasure', '보물상자'], ['shop', '상점'], ['forge', '대장간'],
     ['spring', '샘'], ['altar', '제단'], ['forest', '숲'], ['ruins', '폐허'], ['camp', '야영지'], ['throne', '옥좌'], ['back', '뒷면']]
      .map(([k, n]) => `<div class="glyph"><div class="bc-tile bc-tile--${k === 'back' ? 'hidden' : k} ${k === 'throne' ? 'bc-tile--throne' : ''}" style="width:56px;height:56px;font-size:30px"><svg class="bc-ico"><use href="#bc-tile-${k}"/></svg></div><span>${n}</span><code>bc-tile-${k}</code></div>`).join('')
  document.getElementById('ui').innerHTML =
    g('bc-ui-token', '행동 토큰', '', 'color:var(--bc-candle);--bc-emblem-alt:var(--bc-candle-core)') +
    g('bc-ui-token-spent', '쓴 토큰', '', 'color:var(--bc-ash)') +
    g('bc-ui-token-held', '대기 토큰', '', 'color:var(--bc-gilt);--bc-emblem-alt:var(--bc-candle)') +
    g('bc-ui-hp', '체력', '', 'color:var(--bc-hp)') +
    g('bc-ui-fame', '명성', '', 'color:var(--bc-gilt-hi)') +
    g('bc-ui-level', '레벨', '', 'color:var(--bc-gilt)') +
    g('bc-ui-prayer', '기도 횟수', '', 'color:var(--bc-umbra-hi)') +
    g('bc-ui-cards', '손패 · 더미') +
    g('bc-ui-grave', '마왕의 묘지', '', 'color:var(--bc-umbra-hi)') +
    g('bc-ui-menu', '메뉴') +
    g('bc-item-eye', '예언자의 눈', '', 'color:var(--bc-gilt)') +
    g('bc-item-boots', '바람의 장화', '', 'color:var(--bc-gilt)') +
    g('bc-item-cloak', '망토', '', 'color:var(--bc-gilt)')
</script>
</body>
