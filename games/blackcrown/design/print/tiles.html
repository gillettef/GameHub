<div class="note">
<b>검은 왕관 육각 판 19장 시제품</b> — 판 데이터: <code>src/engine/tiles.ts</code>, 이 파일은 <code>npx tsx tools/tiles-print.ts</code> 로 다시 만든다.<br>
A4, 배율 100%(실제 크기), <b>긴 변 양면 인쇄</b>. 판은 마주 보는 변 사이 100mm. 외곽선을 따라 잘라 두꺼운 판지에 붙인다.<br>
