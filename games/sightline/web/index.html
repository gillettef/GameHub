<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SIGHTLINE · 사이트라인</title>
  <meta name="description" content="앉은 자리가 곧 시야다. 가면무도회 정원의 숨은 정보·블러핑 보드게임 웹 시뮬레이터">
  <meta name="theme-color" content="#0f1713">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SIGHTLINE">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css?v=__BUILD__">
</head>
<body>
  <header class="top">
    <a class="brand" href="./" aria-label="처음으로">
      <span class="brand-mark">◉</span><span class="brand-name">SIGHTLINE</span><span class="brand-sub">사이트라인</span>
    </a>
    <nav class="top-actions">
      <button class="ghost" id="btnRules" type="button">규칙</button>
      <button class="ghost hidden" id="btnLeave" type="button">나가기</button>
    </nav>
  </header>

  <main id="app"></main>

  <dialog id="rulesDlg" class="dlg">
    <div class="dlg-head"><h2>규칙</h2><button class="ghost" data-close type="button">닫기</button></div>
    <div class="dlg-body" id="rulesBody"></div>
  </dialog>

  <dialog id="sheet" class="sheet">
    <p class="sheet-text"></p>
    <div class="sheet-buttons"></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js?v=__BUILD__"></script>
</body>
</html>
