<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15110e">
  <meta name="color-scheme" content="dark">
  <title>RETROCAUSE 룰북</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#15110e; --panel:#241d18; --line:#3b3029; --ink:#efe6da; --muted:#a8998a; --gold:#d9a441; --ember:#e0603a;
      --safe-t:max(env(safe-area-inset-top),12px); --safe-b:max(env(safe-area-inset-bottom),16px);
      --safe-l:max(env(safe-area-inset-left),16px); --safe-r:max(env(safe-area-inset-right),16px); }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; scroll-padding-top: 110px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 5; background: rgba(21,17,14,.94); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--line); padding: var(--safe-t) var(--safe-r) 8px var(--safe-l); }
    .top { display: flex; align-items: center; gap: 8px; max-width: 720px; margin: 0 auto; }
    .back { min-height: 44px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); color: var(--ink); text-decoration: none; font-weight: 700; }
    .ttl { font-weight: 800; flex: 1; }
    nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; max-width: 720px; margin: 8px auto 0; }
    nav::-webkit-scrollbar { display: none; }
    nav a { flex: none; font-size: 13px; color: var(--muted); text-decoration: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
    main { max-width: 720px; margin: 0 auto; padding: 8px var(--safe-r) calc(var(--safe-b) + 24px) var(--safe-l); }
    h1 { font-size: 24px; color: var(--gold); margin: 18px 0 8px; line-height: 1.3; }
    h2 { font-size: 20px; margin: 30px 0 8px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--ember); }
    h3 { font-size: 17px; margin: 22px 0 6px; }
    h4 { font-size: 16px; margin: 18px 0 6px; }
    p { margin: 8px 0; }
    ul, ol { padding-left: 22px; margin: 8px 0; }
    li { margin: 4px 0; }
    code { background: #2f2620; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; font-size: 14px; font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space: nowrap; }
    strong { color: #ffd9a8; }
    blockquote { margin: 12px 0; padding: 10px 14px; background: var(--panel); border-left: 4px solid var(--gold); border-radius: 0 12px 12px 0; font-size: 15px; }
    blockquote p:first-child { margin-top: 0; }
    blockquote p:last-child { margin-bottom: 0; }
    .tbl { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 10px 0; border: 1px solid var(--line); border-radius: 12px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: var(--panel); color: var(--muted); font-weight: 700; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    em { color: var(--muted); font-style: normal; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <a class="back" href="./">‹ 게임</a>
      <span class="ttl">룰북</span>
      <a class="back" href="./rulebook.txt">원문</a>
    </div>
    <nav><!--TOC--></nav>
  </header>
  <main>
<!--BODY-->
  </main>
  <script>
    // 게임 화면의 시트 안(iframe)에서 열리면 상단 이동 버튼을 숨긴다
    if (window !== window.top) document.querySelector('.top').style.display = 'none';
  </script>
</body>
</html>
