<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="3시대 — 궤도 진출">
  <defs>
    <radialGradient id="ntE3Limb" cx="0.5" cy="0" r="1">
      <stop offset="0" stop-color="#6a5a2a"/>
      <stop offset="0.4" stop-color="#2a2a3a"/>
      <stop offset="1" stop-color="#10172b"/>
    </radialGradient>
    <linearGradient id="ntE3Glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd67a" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffd67a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffd67a" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="360" height="120" rx="12" fill="#070b18"/>
  <g fill="#e9edf8" opacity=".75">
    <circle cx="24" cy="18" r=".9"/><circle cx="70" cy="40" r=".7"/><circle cx="116" cy="14" r=".8"/><circle cx="170" cy="30" r=".6"/>
    <circle cx="214" cy="12" r=".9"/><circle cx="262" cy="36" r=".7"/><circle cx="310" cy="16" r=".8"/><circle cx="342" cy="46" r=".6"/>
  </g>
  <!-- 행성 가장자리 -->
  <ellipse cx="180" cy="176" rx="260" ry="84" fill="url(#ntE3Limb)"/>
  <path d="M-80 176a260 84 0 0 1 520 0" fill="none" stroke="url(#ntE3Glow)" stroke-width="2.5" transform="translate(0 0)"/>
  <!-- 궤도선 -->
  <ellipse cx="180" cy="104" rx="190" ry="34" fill="none" stroke="#ffd67a" stroke-opacity=".35" stroke-dasharray="3 5"/>
  <ellipse cx="180" cy="110" rx="150" ry="22" fill="none" stroke="#9cc2ff" stroke-opacity=".3" stroke-dasharray="2 5"/>
