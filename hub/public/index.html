<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GameHub — 보드게임 모음</title>
<style>
  :root { --bg:#f6f1e7; --ink:#1f1b16; --muted:#6b6257; --card:#fffdf8; --line:#e3d9c6; --accent:#b4482f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16130f; --ink:#f1ebe0; --muted:#a39886; --card:#201c17; --line:#3a332a; --accent:#e07a5f; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: "Pretendard", system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif; }
  header { padding: 40px 20px 12px; max-width: 960px; margin: 0 auto; }
  h1 { margin:0; font-size: clamp(28px, 6vw, 44px); letter-spacing:-0.02em; }
  h1 span { color: var(--accent); }
  header p { margin:8px 0 0; color:var(--muted); }
  .filters { display:flex; gap:8px; flex-wrap:wrap; margin-top:20px; }
  .filters button { font:inherit; font-size:14px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink); cursor:pointer; }
  .filters button[aria-pressed="true"] { background:var(--ink); color:var(--bg); border-color:var(--ink); }
  main { max-width:960px; margin:0 auto; padding: 12px 20px 60px; display:grid; gap:14px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  a.card { display:flex; flex-direction:column; gap:6px; padding:18px; border-radius:16px; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; transition: transform .12s, border-color .12s; }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline:none; }
  .name { font-size:20px; font-weight:700; }
  .tagline { color:var(--muted); font-size:14px; flex:1; }
  .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .chip { font-size:12px; padding:3px 9px; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>Game<span>Hub</span></h1>
  <p>게임을 골라 봇과 한 판, 또는 방을 만들어 친구를 초대하세요.</p>
  <div class="filters" role="group" aria-label="필터">
    <button data-f="all" aria-pressed="true">전체</button>
    <button data-f="online" aria-pressed="false">온라인 대전</button>
    <button data-f="bot" aria-pressed="false">봇 대전</button>
    <button data-f="2" aria-pressed="false">2인 가능</button>
  </div>
</header>
<main id="list" aria-live="polite"></main>
<script>
  const list = document.getElementById('list');
  let games = [], filter = 'all';
  const canPlay = (range, n) => { const [a, b = a] = range.replace('인', '').split('~').map(Number); return a <= n && n <= b; };
  function render() {
    const shown = games.filter((g) => filter === 'all' || (filter === '2' ? canPlay(g.players, 2) : g[filter]));
    list.replaceChildren(...shown.map((g) => {
      const a = document.createElement('a');
      a.className = 'card'; a.href = `/${g.slug}/`;
      const chips = [g.players, g.online && '온라인', g.bot && '봇'].filter(Boolean).map((t) => `<span class="chip">${t}</span>`).join('');
      a.innerHTML = `<div class="name"></div><div class="tagline"></div><div class="meta">${chips}</div>`;
      a.querySelector('.name').textContent = g.name;
      a.querySelector('.tagline').textContent = g.tagline;
      return a;
    }));
  }
  document.querySelectorAll('.filters button').forEach((b) => b.addEventListener('click', () => {
    filter = b.dataset.f;
    document.querySelectorAll('.filters button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
  fetch('/api/games').then((r) => r.json()).then((g) => { games = g; render(); });
</script>
</body>
</html>
