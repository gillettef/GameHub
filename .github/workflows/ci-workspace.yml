# 새 기술스택(루트 npm workspaces: packages/* 와 15개 게임) 품질 게이트.
# check: 타입체크·린트·테스트·빌드 한 번. e2e: workspace 마다 따로(병렬) iPhone 화면 확인 — 순서대로 돌리면 20분을 넘는다.
# 게임을 더하면 아래 두 paths 와 e2e matrix 에 넣는다.
name: CI workspace

on:
  push:
    paths: ['packages/**', 'games/blackcrown/**', 'games/smilepark/**', 'games/magicacademy/**', 'games/eleven/**', 'games/rootbound/**', 'games/neoterra/**', 'games/hearsay/**', 'games/election/**', 'games/doubleagent/**', 'games/retrocause/**', 'games/crease/**', 'games/tesseract/**', 'games/lastgrain/**', 'games/lightcone/**', 'games/sightline/**', 'games/proxymind/**', 'hub/server.mjs', 'hub/lib/**', 'package.json', 'package-lock.json', 'eslint.config.js', '.github/workflows/ci-workspace.yml']
    branches: [main, dev]
  pull_request:
    paths: ['packages/**', 'games/blackcrown/**', 'games/smilepark/**', 'games/magicacademy/**', 'games/eleven/**', 'games/rootbound/**', 'games/neoterra/**', 'games/hearsay/**', 'games/election/**', 'games/doubleagent/**', 'games/retrocause/**', 'games/crease/**', 'games/tesseract/**', 'games/lastgrain/**', 'games/lightcone/**', 'games/sightline/**', 'games/proxymind/**', 'hub/server.mjs', 'hub/lib/**', 'package.json', 'package-lock.json', 'eslint.config.js', '.github/workflows/ci-workspace.yml']

concurrency:
  group: ci-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - packages/example
          - games/blackcrown
          - games/crease
          - games/doubleagent
          - games/election
          - games/eleven
          - games/hearsay
          - games/lastgrain
          - games/lightcone
          - games/magicacademy
          - games/neoterra
          - games/proxymind
          - games/retrocause
          - games/rootbound
          - games/sightline
          - games/smilepark
          - games/tesseract
    name: e2e ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: 빌드
        run: npm run build -w ${{ matrix.workspace }}
      - name: iPhone 화면 확인(WebKit)
        # 자동으로 뜨는 창·봇 진행과 클릭이 겹치는 타이밍 실패가 CI 에서 가끔 난다: 실패하면 한 번 더 돌린다(두 번 다 실패해야 실패)
        run: |
          npx playwright install --with-deps webkit
          npm run e2e -w ${{ matrix.workspace }} || { echo "::warning::e2e 첫 시도 실패, 다시 시도"; npm run e2e -w ${{ matrix.workspace }}; }
      - name: 화면 캡처 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots-${{ strategy.job-index }}
          path: ${{ matrix.workspace }}/shots/*.png
          if-no-files-found: ignore
