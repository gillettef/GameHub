# GameHub 모노레포로 옮긴 doubleagent 워크플로(원본: games/doubleagent/.github/workflows/ci.yml). games/doubleagent/** 가 바뀔 때만 돈다.
# 품질 게이트: dev·main 푸시와 PR 마다 검사·빌드를 돌린다 (배포는 deploy-aws.yml 이 따로 맡는다)
name: CI doubleagent

on:
  push:
    paths: ['games/doubleagent/**', '.github/workflows/ci-doubleagent.yml']
    branches: [main, dev]
  pull_request:
    paths: ['games/doubleagent/**', '.github/workflows/ci-doubleagent.yml']

concurrency:
  group: ci-doubleagent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/doubleagent
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 스캐폴딩 전(package.json 없음)에는 검사를 건너뛴다
      - name: package.json 확인
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/doubleagent/package-lock.json

      - run: npm ci
        if: steps.pkg.outputs.exists == 'true'

      - name: 검사·빌드
        if: steps.pkg.outputs.exists == 'true'
        run: npm run typecheck && npm test && npm run build
