# GameHub 모노레포로 옮긴 magicacademy 워크플로(원본: games/magicacademy/.github/workflows/ci.yml). games/magicacademy/** 가 바뀔 때만 돈다.
# 품질 게이트: dev·main 푸시와 PR 마다 검사·빌드를 돌린다 (배포는 deploy-aws.yml 이 따로 맡는다)
name: CI magicacademy

on:
  push:
    paths: ['games/magicacademy/**', '.github/workflows/ci-magicacademy.yml']
    branches: [main, dev]
  pull_request:
    paths: ['games/magicacademy/**', '.github/workflows/ci-magicacademy.yml']

concurrency:
  group: ci-magicacademy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/magicacademy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            games/magicacademy/server/package-lock.json
            games/magicacademy/client/package-lock.json

      - name: 의존성 설치
        run: |
          (cd server && npm ci)
          (cd client && npm ci)
      - name: 규칙 검증
        run: cd server && npm run check
      - name: 빌드
        run: |
          (cd client && npm run build)
          (cd server && npm run build)
