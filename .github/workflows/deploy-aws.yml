# 운영 배포: main 에 병합되면 테스트·타입 검사·pytest 통과 후 EC2(게임 공용 서버, t4g.nano, 서울)에 올리고
# systemd astraltab-prod-server(포트 3201)·astraltab-prod-ai(8001)를 재시작한다.
# 저장소가 비공개라 EC2가 직접 clone 하지 못하므로 git archive 로 소스를 ssh 파이프로 보내고,
# 클라이언트 빌드(vite)는 EC2(메모리 0.5GB) 대신 러너에서 해 client/dist/prod 만 보낸다.
# 서버에서 scripts/aws/deploy-remote.sh 가 의존성 설치·재시작·헬스체크한다. (서비스명·~/AstralTab 경로는 예전 이름 그대로)
# 일상 작업은 dev 에 푸시한다(ci.yml 만 돈다). dev → main PR 병합이 곧 운영 배포다.
# Actions 탭의 수동 실행(workflow_dispatch)으로 재배포도 가능하다.
#
# SSH(22)는 관리자 IP 로만 열려 있다. 배포 직전에 러너 IP 를 보안 그룹에 임시로 열고, 끝나면(성공·실패 무관) 반드시 닫는다.
# 이 규칙 추가/삭제만 가능한 최소 권한 IAM 사용자(astraltab-ci)의 키를 쓴다. (다른 게임 저장소와 공용, 정본은 저장소 밖 aws_config.md)
#
# 필요한 저장소 시크릿: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_SECURITY_GROUP_ID,
#                       EC2_HOST, EC2_HOST_KEY(known_hosts 한 줄), EC2_SSH_PRIVATE_KEY

name: Deploy AWS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 시크릿 확인 — 값은 출력하지 않고 비어 있는 이름만 알린다
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECURITY_GROUP_ID: ${{ secrets.AWS_SECURITY_GROUP_ID }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          missing=0
          for n in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION AWS_SECURITY_GROUP_ID EC2_HOST EC2_HOST_KEY EC2_SSH_PRIVATE_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then echo "OK    $n (값 길이 ${#v})"; else echo "::error::비어 있음: $n"; missing=1; fi
          done
          exit $missing

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci
      - name: 테스트·타입 검사·pytest — 통과해야 배포한다
        run: |
          npm test
          npx tsc --noEmit -p shared && npx tsc --noEmit -p server && npx tsc --noEmit -p client
          pip install -r ai/requirements.txt && python -m pytest ai/tests -q
      - name: 클라이언트 빌드 (EC2 메모리 절약을 위해 러너에서)
        run: cd client && npx vite build --outDir dist/prod --emptyOutDir

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'ap-northeast-2' }}

      - name: 이 러너의 IP 를 SSH(22)에 임시 허용
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)"
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-rootbound}]"

      - name: SSH 키 준비
        env:
          KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts

      - name: 산출물 업로드 (git archive 소스 + client/dist/prod)
        run: |
          git archive HEAD | ssh -i ~/.ssh/ci_key ec2-user@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/AstralTab && tar -x -C ~/AstralTab"
          tar -c -C client/dist prod | ssh -i ~/.ssh/ci_key ec2-user@${{ secrets.EC2_HOST }} \
            "rm -rf ~/AstralTab/client/dist/prod && mkdir -p ~/AstralTab/client/dist && tar -x -C ~/AstralTab/client/dist"

      - name: 재시작 + 헬스체크
        run: |
          ssh -i ~/.ssh/ci_key ec2-user@${{ secrets.EC2_HOST }} \
            "bash ~/AstralTab/scripts/aws/deploy-remote.sh"

      - name: 임시 SSH 허용 제거
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]" || true
          fi
