# main 에 push 되면 테스트·타입체크·빌드를 통과했을 때만 AWS EC2(게임 공용 서버, t4g.nano)에 자동 배포한다.
# SmilePark 는 정적 웹앱이라 러너에서 빌드한 dist 와 정적 서버(scripts/aws/serve.mjs)만 ssh 로 올리고
# systemd 서비스(smilepark, 포트 8090)를 재시작한다. Actions 탭의 수동 실행(workflow_dispatch)으로 재배포도 가능하다.
#
# SSH(22)는 관리자 IP 로만 열려 있다. 배포 직전에 러너 IP 를 보안 그룹에 임시로 열고, 끝나면(성공·실패 무관) 반드시 닫는다.
# 이 규칙 추가/삭제만 가능한 최소 권한 IAM 사용자(astraltab-ci)의 키를 쓴다. (다른 게임 저장소와 공용)
#
# 필요한 저장소 시크릿: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION, AWS_SECURITY_GROUP_ID,
#                       EC2_HOST, EC2_HOST_KEY(known_hosts 한 줄), EC2_SSH_PRIVATE_KEY

name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 테스트 — 통과해야 배포한다
        run: npm test

      - name: 타입체크 + 빌드
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 이 러너의 IP 를 SSH(22)에 임시 허용
        run: |
          RUNNER_IP="$(curl -s https://checkip.amazonaws.com)"
          echo "RUNNER_IP=${RUNNER_IP}" >> "$GITHUB_ENV"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32,Description=github-actions-smilepark}]"

      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/ci_key
          chmod 600 ~/.ssh/ci_key
          echo "${{ secrets.EC2_HOST_KEY }}" >> ~/.ssh/known_hosts

      - name: 산출물 업로드
        run: |
          tar -c dist scripts/aws/serve.mjs \
            | ssh -i ~/.ssh/ci_key ec2-user@${{ secrets.EC2_HOST }} \
              "rm -rf ~/smilepark/dist && mkdir -p ~/smilepark && tar -x -C ~/smilepark"

      - name: 재시작 + 헬스체크
        run: |
          ssh -i ~/.ssh/ci_key ec2-user@${{ secrets.EC2_HOST }} \
            "set -e; sudo systemctl restart smilepark && sleep 2 && curl -sf -o /dev/null http://localhost:8090/"

      - name: 임시 SSH 허용 제거
        if: always()
        run: |
          if [ -n "${RUNNER_IP:-}" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "${{ secrets.AWS_SECURITY_GROUP_ID }}" \
              --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${RUNNER_IP}/32}]" || true
          fi
