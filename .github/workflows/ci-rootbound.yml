# GameHub 모노레포로 옮긴 rootbound 워크플로(원본: games/rootbound/.github/workflows/ci.yml). games/rootbound/** 가 바뀔 때만 돈다.
# 품질 게이트: dev·main 푸시와 PR 마다 테스트·타입 검사·pytest·클라이언트 빌드를 돌린다 (배포는 deploy-aws.yml 이 따로 맡는다)
name: CI rootbound

on:
  push:
    paths: ['games/rootbound/**', '.github/workflows/ci-rootbound.yml']
    branches: [main, dev]
  pull_request:
    paths: ['games/rootbound/**', '.github/workflows/ci-rootbound.yml']

concurrency:
  group: ci-rootbound-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/rootbound
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/rootbound/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit -p shared && npx tsc --noEmit -p server && npx tsc --noEmit -p client
      - run: pip install -r ai/requirements.txt && python -m pytest ai/tests -q
      - name: 클라이언트 빌드
        run: cd client && npx vite build --outDir dist/prod --emptyOutDir
