# GameHub 모노레포로 옮긴 neoterra 워크플로(원본: games/neoterra/.github/workflows/ci.yml). games/neoterra/** 가 바뀔 때만 돈다.
# 품질 게이트: 푸시·PR마다 /mobile-check 스킬과 같은 검사를 실행한다 (배포는 deploy-aws.yml 이 따로 맡는다)
name: CI neoterra

on:
  push:
    paths: ['games/neoterra/**', '.github/workflows/ci-neoterra.yml']
    branches: [main, dev]
  pull_request:
    paths: ['games/neoterra/**', '.github/workflows/ci-neoterra.yml']

concurrency:
  group: ci-neoterra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/neoterra
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 스캐폴딩 전(package.json 없음)에는 검사를 건너뛴다
      - name: package.json 확인
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/neoterra/package-lock.json

      - run: npm ci
        if: steps.pkg.outputs.exists == 'true'

      - name: 타입체크·테스트·빌드
        if: steps.pkg.outputs.exists == 'true'
        run: npm run typecheck && npm test && npm run build
