# GameHub 모노레포로 옮긴 crease 워크플로(원본: games/crease/.github/workflows/ci.yml). games/crease/** 가 바뀔 때만 돈다.
# 품질 게이트: dev·main 푸시와 PR 마다 검사·빌드를 돌린다 (배포는 deploy-aws.yml 이 따로 맡는다)
name: CI crease

on:
  push:
    paths: ['games/crease/**', '.github/workflows/ci-crease.yml']
    branches: [main, dev]
  pull_request:
    paths: ['games/crease/**', '.github/workflows/ci-crease.yml']

concurrency:
  group: ci-crease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: games/crease
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 디지털 프로토타입(package.json) 이 생기기 전에는 검사를 건너뛴다
      - name: package.json 확인
        id: pkg
        run: |
          if [ -f package.json ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.pkg.outputs.exists == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: games/crease/package-lock.json

      - run: npm ci
        if: steps.pkg.outputs.exists == 'true'

      - name: 검사·빌드
        if: steps.pkg.outputs.exists == 'true'
        run: npm test && npm run build
